<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechNest AI Support</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23141a2e'/%3E%3Cpath d='M6 8a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3H10l-3.2 2.4A.6.6 0 0 1 6 18V8z' fill='none' stroke='%2300d9a3' stroke-width='1.7' stroke-linejoin='round'/%3E%3Ccircle cx='9.5' cy='10.5' r='1' fill='%2300d9a3'/%3E%3Ccircle cx='14.5' cy='10.5' r='1' fill='%2300d9a3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0b0f13;
    --bg-1: #10161c;
    --panel: #141b22;
    --panel-2: #1a222b;
    --line: #262f39;
    --ink: #eef3f6;
    --muted: #8ea0ab;
    --accent: #4fd1c5;
    --accent-2: #6c8bff;
    --user-bubble: #26313c;
    --bot-bubble: #171f27;
    --good: #4fd1a0;
    --bad: #f4716c;
    --font-display: "Bricolage Grotesque", "Segoe UI", sans-serif;
    --font-body: "Hanken Grotesk", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
      radial-gradient(60% 45% at 15% 0%, rgba(79,209,197,0.10), transparent 65%),
      radial-gradient(55% 45% at 100% 100%, rgba(108,139,255,0.10), transparent 65%),
      var(--bg-0);
    font-family: var(--font-body);
    color: var(--ink);
  }
  svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .app {
    width: 100%;
    max-width: 480px;
    height: min(92vh, 780px);
    display: flex;
    flex-direction: column;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.45);
  }

  /* Header */
  .app-header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 16px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #061014; font-weight: 700; font-family: var(--font-display);
  }
  .brand-text h1 { margin: 0; font-family: var(--font-display); font-size: 1.02rem; line-height: 1.2; }
  .status-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
  .status-dot.off { background: var(--bad); }
  .status-dot.warn { background: #e7b24c; }
  .status-text { font-size: 0.74rem; color: var(--muted); }
  .header-actions { display: flex; gap: 6px; }
  .icon-btn, .mode-toggle {
    height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent;
    color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; font: inherit;
  }
  .icon-btn { width: 30px; }
  .mode-toggle { padding: 0 11px; font-size: 0.76rem; font-weight: 600; color: var(--ink); }
  .icon-btn:hover, .mode-toggle:hover { background: var(--panel-2); border-color: var(--accent); color: var(--ink); }
  .mode-toggle.fast { color: var(--muted); }

  /* Starter chips */
  .starters { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .starters::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); font: inherit; font-size: 0.76rem; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .chip:hover { color: var(--ink); border-color: var(--accent); }

  /* Messages (scrollbar hidden, still scrolls) */
  .messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .messages::-webkit-scrollbar { display: none; }
  .row { display: flex; flex-direction: column; gap: 6px; max-width: 88%; animation: rise 0.22s ease; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.bot { align-self: flex-start; align-items: flex-start; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .bubble { padding: 11px 14px; border-radius: 14px; font-size: 0.92rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .row.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--line); border-bottom-left-radius: 4px; }

  .sug-label { font-size: 0.72rem; color: var(--muted); padding: 0 2px; }
  .sug-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .sug { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 0.76rem; cursor: pointer; text-align: left; }
  .sug:hover { border-color: var(--accent); color: var(--accent); }

  .feedback { display: flex; gap: 4px; }
  .fb {
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); background: transparent;
    color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: color 0.15s, border-color 0.15s;
  }
  .fb:hover { color: var(--ink); border-color: var(--muted); }
  .fb.up.on { color: var(--good); border-color: var(--good); }
  .fb.down.on { color: var(--bad); border-color: var(--bad); }
  .fb:disabled { cursor: default; }
  .fb:disabled:not(.on) { opacity: 0.4; }

  .typing-bubble { display: flex; gap: 4px; align-items: center; padding: 13px 16px; }
  .typing-bubble span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite ease-in-out; }
  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* Input */
  .input-bar { display: flex; align-items: flex-end; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea {
    flex: 1; resize: none; max-height: 96px; min-height: 42px; padding: 10px 12px;
    border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg-0); color: var(--ink);
    font: inherit; font-size: 0.9rem; line-height: 1.4; scrollbar-width: none;
  }
  textarea::-webkit-scrollbar { display: none; }
  textarea:focus-visible { outline: none; border-color: var(--accent); }
  .send-btn {
    width: 42px; height: 42px; border-radius: 10px; border: 0; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #061014;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .send-btn:disabled { opacity: 0.5; cursor: wait; }
  .hint { margin: 0; padding: 0 14px 10px; font-size: 0.7rem; color: var(--muted); }

  @media (max-width: 420px) {
    .app { border-radius: 0; height: 100vh; max-width: 100%; }
    body { padding: 0; }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">TN</div>
        <div class="brand-text">
          <h1>TechNest AI Support</h1>
          <div class="status-row"><span class="status-dot" id="status-dot"></span><span class="status-text" id="status-text">Online</span></div>
        </div>
      </div>
      <div class="header-actions">
        <button class="mode-toggle" id="mode-toggle" type="button" hidden
                title="Smart: understands any wording. Fast: instant keyword match.">
          <svg class="i" id="mode-icon" viewBox="0 0 24 24"></svg><span id="mode-label">Smart</span>
        </button>
        <button class="icon-btn" id="clear-btn" type="button" title="New conversation" aria-label="New conversation">
          <svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </header>

    <div class="starters" id="starters"></div>
    <div class="messages" id="messages"></div>

    <form class="input-bar" id="chat-form">
      <textarea id="user-input" rows="1" placeholder="Ask about orders, shipping, returns, payments..."></textarea>
      <button type="submit" class="send-btn" id="send-btn" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <p class="hint">Enter to send · Shift+Enter for a new line</p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const messagesEl = $('messages'), form = $('chat-form'), input = $('user-input'), sendBtn = $('send-btn');
    const statusText = $('status-text'), statusDot = $('status-dot');
    const modeToggle = $('mode-toggle'), modeIcon = $('mode-icon'), modeLabel = $('mode-label');

    const ICONS = {
      smart: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
      fast: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
      up: '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
      down: '<path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>',
    };
    const icon = (name) => `<svg class="i" viewBox="0 0 24 24">${ICONS[name]}</svg>`;

    let mode = 'smart';          // 'smart' = AI reads the whole FAQ; 'fast' = instant local match
    let history = [];            // recent turns, sent along so follow-ups ("and for international?") make sense
    let busy = false;

    function setMode(m) {
      mode = m;
      modeToggle.classList.toggle('fast', m === 'fast');
      modeIcon.innerHTML = ICONS[m];
      modeLabel.textContent = m === 'smart' ? 'Smart' : 'Fast';
    }
    modeToggle.addEventListener('click', () => setMode(mode === 'smart' ? 'fast' : 'smart'));
    setMode('smart');

    // The Smart/Fast switch only does something when an AI key is set, so it's hidden otherwise.
    async function loadHealth() {
      try {
        const data = await (await fetch('/health')).json();
        modeToggle.hidden = !(data.ai_providers_configured || []).length;
      } catch (e) { setOnline(false); }
    }
    function setStatus(text, state) {
      statusText.textContent = text;
      statusDot.className = 'status-dot' + (state ? ' ' + state : '');
    }
    function setOnline(ok) { setStatus(ok ? 'Online' : 'Connection problem', ok ? '' : 'off'); }

    const STARTERS = [
      "When will my order arrive?",
      "Can I get a refund?",
      "Which payment methods can I use?",
      "Is there a warranty?",
      "Where is my order?",
    ];
    function renderStarters() {
      $('starters').innerHTML = '';
      STARTERS.forEach((q) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip'; b.textContent = q;
        b.addEventListener('click', () => ask(q));
        $('starters').appendChild(b);
      });
    }

    function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    function addUser(text) {
      const row = document.createElement('div');
      row.className = 'row user';
      const bubble = document.createElement('div');
      bubble.className = 'bubble'; bubble.textContent = text;
      row.appendChild(bubble);
      messagesEl.appendChild(row); scrollDown();
    }

    function addTyping() {
      const row = document.createElement('div');
      row.className = 'row bot';
      row.innerHTML = '<div class="bubble typing-bubble"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(row); scrollDown();
      return row;
    }

    function addBot(data, question) {
      const row = document.createElement('div');
      row.className = 'row bot';
      const bubble = document.createElement('div');
      bubble.className = 'bubble'; bubble.textContent = data.answer;
      row.appendChild(bubble);

      // Nothing matched: offer the closest things the bot can actually answer.
      if (!data.answered && data.suggestions && data.suggestions.length) {
        const label = document.createElement('div');
        label.className = 'sug-label'; label.textContent = 'You could try asking:';
        const list = document.createElement('div');
        list.className = 'sug-list';
        data.suggestions.forEach((q) => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'sug'; b.textContent = q;
          b.addEventListener('click', () => ask(q));
          list.appendChild(b);
        });
        row.appendChild(label); row.appendChild(list);
      }

      // Thumbs feed data/feedback.csv so wrong answers can be found and fixed.
      if (data.answered && !data.smalltalk) {
        const fb = document.createElement('div');
        fb.className = 'feedback';
        const up = document.createElement('button');
        up.type = 'button'; up.className = 'fb up'; up.title = 'Helpful'; up.setAttribute('aria-label', 'Helpful'); up.innerHTML = icon('up');
        const down = document.createElement('button');
        down.type = 'button'; down.className = 'fb down'; down.title = 'Not helpful'; down.setAttribute('aria-label', 'Not helpful'); down.innerHTML = icon('down');
        const send = (helpful) => {
          up.disabled = down.disabled = true;
          (helpful ? up : down).classList.add('on');
          fetch('/feedback', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, matched_question: data.matched_question || '', helpful }),
          }).catch(() => {});
        };
        up.addEventListener('click', () => send(true));
        down.addEventListener('click', () => send(false));
        fb.appendChild(up); fb.appendChild(down); row.appendChild(fb);
      }

      messagesEl.appendChild(row); scrollDown();
    }

    function greet() {
      messagesEl.innerHTML = '';
      history = [];
      const row = document.createElement('div');
      row.className = 'row bot';
      row.innerHTML = '<div class="bubble"></div>';
      row.firstChild.textContent = "Hi! I'm TechNest's support assistant. Ask me anything about orders, shipping, returns, payments, warranty or your account, in your own words.";
      messagesEl.appendChild(row);
    }

    async function ask(question) {
      if (busy) return;
      busy = true; sendBtn.disabled = true;
      addUser(question);
      input.value = ''; autoResize();
      const typing = addTyping();
      const sentHistory = history.slice(-12);

      try {
        const res = await fetch('/ask', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question, mode, history: sentHistory }),
        });
        const data = await res.json();
        typing.remove();
        addBot(data, question);
        history.push({ role: 'user', content: question }, { role: 'assistant', content: data.answer });
        // The AI is configured but couldn't be reached: say so, so a basic answer isn't mistaken for the AI's.
        if (data.ai_unavailable) setStatus('AI offline, using basic answers', 'warn'); else setOnline(true);
      } catch (err) {
        typing.remove();
        addBot({ answer: 'I could not reach the server. Please check that it is running and try again.', answered: false }, question);
        setOnline(false);
      } finally {
        busy = false; sendBtn.disabled = false; input.focus();
      }
    }

    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 96) + 'px';
    }
    input.addEventListener('input', autoResize);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (q) ask(q);
    });
    $('clear-btn').addEventListener('click', greet);

    renderStarters();
    greet();
    loadHealth();
  </script>
</body>
</html>
